[pytest]
DJANGO_SETTINGS_MODULE = smartSchool.settings_test
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=school
    --cov-report=term-missing
    --cov-fail-under=75
markers =
    slow: tests lents (nécessitent une vraie connexion DB)
    unit: tests unitaires purs
